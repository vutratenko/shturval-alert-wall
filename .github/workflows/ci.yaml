name: CI
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            addon/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Check PWA build artifacts
        run: |
          test -s cmd/server/static/manifest.webmanifest
          test -s cmd/server/static/sw.js
          test -s cmd/server/static/icons/icon-192.png
          test -s cmd/server/static/icons/icon-512.png
          grep -q '"start_url"' cmd/server/static/manifest.webmanifest
          grep -q 'shturval-alerts' cmd/server/static/sw.js
      - run: npm ci
        working-directory: addon
      - run: npm test
        working-directory: addon
      - run: npm run build
        working-directory: addon
      - name: Check addon build artifacts
        run: |
          test -s addon/dist/manifest.json
          test -s addon/dist/background.js
          test -s addon/dist/popup.html
          test -s addon/dist/options.html
          grep -q 'shturval-alert-wall@sion2k.ru' addon/dist/manifest.json
      - run: go test -race ./...
      - run: go vet ./...
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.16.4 }
      - run: helm lint charts/shturval-alert-wall
      - run: helm template alert-wall charts/shturval-alert-wall > /dev/null
  image:
    needs: test
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: registry.sion2k.ru
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: registry.sion2k.ru/shturval/shturval-alert-wall
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          provenance: false
          sbom: false
      - name: Bump image tag in values-cluster.yaml
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          FILE=charts/shturval-alert-wall/values-cluster.yaml
          sed -i "s/^  tag: .*/  tag: ${IMAGE_TAG:0:11}/" "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --staged --quiet; then
            echo "No tag change"
            exit 0
          fi
          git commit -m "ci: bump image tag [skip ci]"
          git push