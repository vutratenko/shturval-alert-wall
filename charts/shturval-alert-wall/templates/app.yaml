apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "alertwall.name" . }}
  namespace: {{ include "alertwall.namespace" . }}
---
{{- if .Values.auth.enabled }}
apiVersion: auth.shturval.tech/v1beta1
kind: AuthOidcClient
metadata:
  name: {{ .Values.auth.oidcClientName }}
  namespace: {{ include "alertwall.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  providerType: shturval
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "alertwall.name" . }}-oidc
  namespace: {{ include "alertwall.namespace" . }}
rules:
  - apiGroups: ["auth.shturval.tech"]
    resources: ["authoidcclients"]
    resourceNames: [{{ .Values.auth.oidcClientName | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "alertwall.name" . }}-oidc
  namespace: {{ include "alertwall.namespace" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "alertwall.name" . }}
    namespace: {{ include "alertwall.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "alertwall.name" . }}-oidc
---
{{- end }}
{{- if .Values.rbac.clusterRole }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "alertwall.name" . }}-{{ .Release.Namespace }}
rules:
  - apiGroups: [operator.victoriametrics.com]
    resources: [vmalertmanagers]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "alertwall.name" . }}-{{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "alertwall.name" . }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "alertwall.name" . }}
    namespace: {{ include "alertwall.namespace" . }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alertwall.name" . }}
  namespace: {{ include "alertwall.namespace" . }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "alertwall.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "alertwall.name" . }}
    spec:
      serviceAccountName: {{ include "alertwall.name" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- if .Values.push.persistence.enabled }}
      securityContext:
        fsGroup: 65532
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SOURCE_MODE
              value: {{ .Values.sources.mode | quote }}
            - name: VMSELECT_URL
              value: {{ .Values.sources.vmselectUrl | quote }}
            - name: POLL_INTERVAL
              value: {{ .Values.pollInterval | quote }}
            - name: GROUP_WINDOW
              value: {{ .Values.groupWindow | quote }}
            - name: POLL_TIMEOUT
              value: {{ .Values.pollTimeout | quote }}
            - name: DISCOVERY_INTERVAL
              value: {{ .Values.discoveryInterval | quote }}
            - name: DISCOVERY_ENABLED
              value: {{ .Values.sources.discoveryEnabled | quote }}
            - name: MOOD_MAX_WARNING_CALM
              value: {{ .Values.mood.maxWarningCalm | quote }}
            - name: MOOD_MIN_CRITICAL_PANIC
              value: {{ .Values.mood.minCriticalPanic | quote }}
            - name: MOOD_MIN_WARNING_PANIC
              value: {{ .Values.mood.minWarningPanic | quote }}
            {{- if .Values.sources.static }}
            - name: STATIC_SOURCES
              value: {{ range $i, $s := .Values.sources.static }}{{ if $i }};{{ end }}{{ $s.cluster }}={{ $s.url }}{{ end }}
            {{- end }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.auth.enabled }}
            - name: AUTH_ENABLED
              value: "true"
            - name: AUTH_REDIRECT_URL
              value: {{ .Values.auth.redirectUrl | quote }}
            - name: AUTH_OIDC_CLIENT_NAME
              value: {{ .Values.auth.oidcClientName | quote }}
            - name: AUTH_SESSION_TTL
              value: {{ .Values.auth.sessionTtl | quote }}
            {{- with .Values.auth.cookieSecret }}
            - name: AUTH_COOKIE_SECRET
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: PUSH_SUBJECT
              value: {{ .Values.push.subject | quote }}
            {{- if .Values.push.persistence.enabled }}
            - name: PUSH_STORE_PATH
              value: /data
            {{- end }}
          {{- if .Values.push.persistence.enabled }}
          volumeMounts:
            - name: push-data
              mountPath: /data
          {{- end }}
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
      {{- if .Values.push.persistence.enabled }}
      volumes:
        - name: push-data
          persistentVolumeClaim:
            claimName: {{ include "alertwall.name" . }}-push
      {{- end }}
---
{{- if .Values.push.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "alertwall.name" . }}-push
  namespace: {{ include "alertwall.namespace" . }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.push.persistence.size }}
  {{- with .Values.push.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "alertwall.name" . }}
  namespace: {{ include "alertwall.namespace" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "alertwall.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http