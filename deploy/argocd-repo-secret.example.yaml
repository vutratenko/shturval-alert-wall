# One-time: add deploy key in GitHub, then apply with private key in sshPrivateKey.
# Label required for Argo CD to discover this repository credential.
apiVersion: v1
kind: Secret
metadata:
  name: repo-shturval-alert-wall
  namespace: shturval-cd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: git@github.com:vutratenko/shturval-alert-wall.git
  sshPrivateKey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    REPLACE_ME
    -----END OPENSSH PRIVATE KEY-----