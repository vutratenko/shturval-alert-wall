# Cluster overlay (Argo CD). image.tag is bumped by CI on push to main.
image:
  tag: sha-8958895
  pullSecrets:
    - regcred
sources:
  mode: alertmanager
  discoveryEnabled: "true"
rbac:
  clusterRole: true
auth:
  enabled: true
  redirectUrl: https://alerts.sion2k-cluster.sion2k.ru/oauth2/callback
gateway:
  enabled: true
  hostnames:
    - alerts.sion2k-cluster.sion2k.ru
push:
  persistence:
    enabled: true