image:
  repository: ghcr.io/vutratenko/shturval-alert-wall
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []
namespaceOverride: ""
replicas: 1
service:
  type: ClusterIP
  port: 8080
ingress:
  enabled: false
  className: ""
  hosts:
    - host: alerts.local
      paths: [{ path: /, pathType: Prefix }]
gateway:
  enabled: false
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: sion2k-app-listeners
      namespace: gateway-system
  hostnames: []
# auth.enabled false skips Shturval OIDC. Discovery and ClusterRole stay as set below.
auth:
  enabled: false
  redirectUrl: ""
  oidcClientName: shturval-alert-wall-oidc
  sessionTtl: 24h
  cookieSecret: ""
sources:
  mode: alertmanager
  static: []
  # static:
  #   - cluster: sion2k-cluster
  #     url: http://vmalertmanager-shturval-metrics-collector.victoria-metrics.svc:9093
  vmselectUrl: ""
  discoveryEnabled: "true"
pollInterval: 1s
groupWindow: 15m
pollTimeout: 5s
discoveryInterval: 60s
mood:
  maxWarningCalm: 2
  minCriticalPanic: 2
  minWarningPanic: 10
rbac:
  clusterRole: true
# Web Push subscriptions and VAPID keys. Keep replicas at 1: the volume is ReadWriteOnce.
push:
  subject: mailto:alerts@sion2k.ru
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""